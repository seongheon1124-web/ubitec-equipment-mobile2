<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1f4e79" />
<title>유비텍 장비관리대장</title>
<style>
:root{--navy:#1f4e79;--blue:#0b6efd;--green:#009966;--red:#c44a4a;--bg:#f3f6f9;--line:#dbe3ea;--text:#1f2937;--muted:#6b7280}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px 12px;box-shadow:0 2px 8px #0002} header h1{font-size:19px;margin:0 0 10px}.toolbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.toolbar button{flex:0 0 auto;border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:9px;padding:8px 11px;font-weight:700}
main{padding:12px;max-width:980px;margin:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}.searchrow input,.filters select,.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:15px;background:#fff}.searchrow button,.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--navy);color:#fff;font-weight:700}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.checks{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px;color:var(--muted);font-size:13px}.checks button{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 8px;text-align:center}.kpi small{display:block;color:var(--muted);font-size:11px}.kpi strong{display:block;font-size:19px;color:var(--navy);margin-top:3px}.kpi.warn strong{color:var(--red)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tabs button{border:1px solid var(--navy);background:white;color:var(--navy);padding:10px;border-radius:10px;font-weight:800}.tabs button.active{background:var(--navy);color:#fff}.section{display:none}.section.active{display:block}
.listTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.cardHead{display:flex;justify-content:space-between;gap:10px}.cardTitle{font-weight:800;font-size:16px}.badge{font-size:11px;background:#e8f0f7;color:var(--navy);border-radius:999px;padding:4px 8px;white-space:nowrap}.cardSub{font-size:13px;color:#475569;margin:4px 0 8px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;background:#f8fafc;border-radius:8px;padding:7px}.quick b{color:#334155}.cardActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.cardActions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-weight:700}.cardActions .go{color:#0563c1;border-color:#b8d6f3}.cardActions button:disabled{color:#94a3b8;border-color:#e2e8f0;background:#f8fafc}.cardActions .edit{color:#087d57}.cardActions .del{color:#b42318}.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.pager button{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.statbox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.statbox h3{margin:0;padding:11px;font-size:14px;background:#f8fafc}.statrow{display:flex;justify-content:space-between;border-top:1px solid #eef2f6;padding:8px 10px;font-size:13px}.statrow b{color:var(--navy)}
.fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:30px;box-shadow:0 6px 20px #0003;z-index:25}
dialog{border:0;border-radius:14px;padding:0;width:min(94vw,900px);max-height:92vh;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}.dlgHead{position:sticky;top:0;background:var(--navy);color:#fff;padding:13px 15px;font-weight:800;z-index:2}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-height:70vh;overflow:auto}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 5px}.field textarea{min-height:72px;resize:vertical}.dlgFoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;background:#f5f7fa;position:sticky;bottom:0}.dlgFoot button{border:0;border-radius:9px;padding:10px 16px;font-weight:800}.cancel{background:#e5e7eb}.save{background:var(--green);color:#fff}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw;text-align:center}#toast.show{opacity:1}
.hidden{display:none!important}
@media(max-width:700px){.filters{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:span 2}.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}header h1{font-size:18px}}
</style>
</head>
<body>
<header><h1>유비텍 장비관리대장 · Mobile</h1><div class="toolbar">
<button id="btnImport">엑셀 가져오기</button><button id="btnExport">엑셀 내보내기</button><button id="btnBackup">백업</button><button id="btnRestore">백업 복원</button><button id="btnClear">전체 삭제</button>
</div></header>
<main>
<div class="panel">
<div class="searchrow"><input id="q" placeholder="통합 검색 (고객사, Model, IP, S/N 등)"/><button id="searchBtn">조회</button></div>
<div class="filters"><select id="fCustomer"></select><select id="fCategory"></select><select id="fModel"></select></div>
<div class="checks"><label><input id="hideAccount" type="checkbox"> 계정 숨기기</label><button id="resetBtn">검색 초기화</button></div>
</div>
<div class="kpis"><div class="kpi"><small>조회 장비 수</small><strong id="kTotal">0</strong></div><div class="kpi"><small>고객사 수</small><strong id="kCustomer">0</strong></div><div class="kpi"><small>구분 수</small><strong id="kCategory">0</strong></div><div class="kpi"><small>Model 수</small><strong id="kModel">0</strong></div><div class="kpi warn"><small>IP 미입력</small><strong id="kMissing">0</strong></div></div>
<div class="tabs"><button id="tabList" class="active">장비 목록</button><button id="tabStats">장비 현황</button></div>
<section id="secList" class="section active"><div class="listTop"><span class="muted" id="resultText"></span><span class="muted">한 페이지 100건</span></div><div id="cards" class="cards"></div><div class="pager"><button id="prev">◀ 이전</button><span id="pageText">1 / 1</span><button id="next">다음 ▶</button></div></section>
<section id="secStats" class="section"><div class="stats"><div class="statbox"><h3>고객사별 수량</h3><div id="sCustomer"></div></div><div class="statbox"><h3>구분별 수량</h3><div id="sCategory"></div></div><div class="statbox"><h3>Model별 수량</h3><div id="sModel"></div></div></div></section>
</main>
<button class="fab" id="addBtn">＋</button>
<input id="fileImport" type="file" accept=".xlsx" multiple class="hidden"/><input id="fileRestore" type="file" accept=".json" class="hidden"/>
<dialog id="editDlg"><div class="dlgHead" id="dlgTitle">장비 등록</div><div class="formgrid" id="formGrid"></div><div class="dlgFoot"><button class="cancel" id="cancelEdit">취소</button><button class="save" id="saveEdit">저장</button></div></dialog>
<div id="toast"></div>
<script>
const HEADERS=['No','고객사명','구분','Model','시스템 용도','Hostname','접속 URL','CLI 접속','IP정보','게이트웨이 정보','Port정보','S/N','MAC','계정','위치','OS 정보(펌웨어 정보)','도입연도','담당 엔지니어','담당 영업','고객 담당자','접속방법','비고1','비고2','비고3'];
const MULTI=new Set(['접속 URL','CLI 접속','IP정보','Port정보','계정','OS 정보(펌웨어 정보)','담당 엔지니어','담당 영업','고객 담당자','접속방법','비고1','비고2','비고3']);
let db=null, allRows=[], filtered=[], page=0, editingId=null; const PAGE=100;
const $=id=>document.getElementById(id); const clean=v=>(v??'').toString().trim();
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('UbitecEquipmentLedger',1);r.onupgradeneeded=e=>{const d=e.target.result;const s=d.createObjectStore('equipment',{keyPath:'id',autoIncrement:true});s.createIndex('dedup','dedup',{unique:true});s.createIndex('customer','고객사명');s.createIndex('category','구분');s.createIndex('model','Model')};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction('equipment',mode).objectStore('equipment')}
function getAll(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(o){return new Promise((res,rej)=>{const r=tx('readwrite').put(o);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(o){return new Promise((res,rej)=>{const r=tx('readwrite').add(o);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearDB(){return new Promise((res,rej)=>{const r=tx('readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function isId(v){v=clean(v);return v&&v!=='-'&&v.toLowerCase()!=='n/a'&&v!=='미입력'}
function dedupKey(o){const sn=clean(o['S/N']),mac=clean(o['MAC']),customer=clean(o['고객사명']),host=clean(o['Hostname']),no=clean(o['No']);if(isId(sn))return 'SN|'+sn.toUpperCase();if(isId(mac)){const m=mac.replace(/[^0-9a-f]/ig,'').toUpperCase();if(m.length>=6)return 'MAC|'+m}if(isId(customer)&&isId(host))return 'HOST|'+customer.toUpperCase()+'|'+host.toUpperCase();if(isId(customer)&&isId(no))return 'NO|'+customer.toUpperCase()+'|'+no.toUpperCase();return 'ROW|'+crypto.randomUUID().replaceAll('-','')}
function normalize(o){const n={};HEADERS.forEach(h=>n[h]=clean(o[h]));n.dedup=dedupKey(n);n.updated_at=new Date().toISOString();return n}
async function upsertByDedup(o){o=normalize(o);const existing=allRows.find(x=>x.dedup===o.dedup);if(existing)o.id=existing.id;await put(o)}
async function reload(){allRows=await getAll();allRows.sort((a,b)=>(a.id||0)-(b.id||0));buildFilters();applyFilter()}
function setSelect(sel,label,vals,current){sel.innerHTML='';const a=document.createElement('option');a.textContent=label;a.value='';sel.appendChild(a);[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')).forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o)});if([...sel.options].some(o=>o.value===current))sel.value=current}
function buildFilters(){const c=$('fCustomer').value,t=$('fCategory').value,m=$('fModel').value;setSelect($('fCustomer'),'고객사 전체',allRows.map(x=>x['고객사명']),c);setSelect($('fCategory'),'구분 전체',allRows.map(x=>x['구분']),t);setSelect($('fModel'),'Model 전체',allRows.map(x=>x['Model']),m)}
function applyFilter(){const q=clean($('q').value).toLowerCase().split(/\s+/).filter(Boolean),c=$('fCustomer').value,t=$('fCategory').value,m=$('fModel').value;filtered=allRows.filter(r=>{if(c&&r['고객사명']!==c)return false;if(t&&r['구분']!==t)return false;if(m&&r['Model']!==m)return false;const s=HEADERS.map(h=>r[h]||'').join(' ').toLowerCase();return q.every(x=>s.includes(x))});const pages=Math.max(1,Math.ceil(filtered.length/PAGE));if(page>=pages)page=pages-1;if(page<0)page=0;render()}
function uniqCount(k){return new Set(filtered.map(x=>x[k]).filter(Boolean)).size}
function render(){ $('kTotal').textContent=filtered.length.toLocaleString();$('kCustomer').textContent=uniqCount('고객사명').toLocaleString();$('kCategory').textContent=uniqCount('구분').toLocaleString();$('kModel').textContent=uniqCount('Model').toLocaleString();$('kMissing').textContent=filtered.filter(x=>!clean(x['IP정보'])).length.toLocaleString();$('resultText').textContent=`조회 ${filtered.length.toLocaleString()}건 / 전체 ${allRows.length.toLocaleString()}건`;renderCards();renderStats() }
function esc(s){return clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function firstToken(v){const s=clean(v);if(!s||s==='-'||s.toLowerCase()==='n/a'||s==='미입력')return '';const m=s.match(/(?:https?|ssh|telnet):\/\/[^\s,;]+/i);if(m)return m[0];const ip=s.match(/(?:\d{1,3}\.){3}\d{1,3}(?:\/\d{1,2})?/);if(ip)return ip[0].replace(/\/\d{1,2}$/,'');return s.split(/[\r\n,;]/)[0].trim()}
function webSpec(r){let s=firstToken(r['접속 URL']);if(!s)return null;if(!/^https?:\/\//i.test(s)){const method=clean(r['접속방법']).toLowerCase();s=(method.includes('http')&&!method.includes('https')?'http://':'https://')+s}try{const u=new URL(s);if(['http:','https:'].includes(u.protocol))return {url:u.href,type:u.protocol.slice(0,-1)}}catch{}return null}
function cliSpec(r){let s=firstToken(r['CLI 접속']);const method=clean(r['접속방법']).toLowerCase();let type=method.includes('telnet')?'telnet':'ssh';if(/^telnet:\/\//i.test(s))type='telnet';else if(/^ssh:\/\//i.test(s))type='ssh';if(!s)s=firstToken(r['IP정보']);if(!s)return null;s=s.replace(/^https?:\/\//i,'').replace(/^ssh:\/\//i,'').replace(/^telnet:\/\//i,'').replace(/\/.*$/,'');if(!s)return null;return {url:type+'://'+s,type}}
function openSpec(s){if(!s)return;if(window.Android&&Android.openExternal){Android.openExternal(s.url);return}if(s.type==='http'||s.type==='https'){window.open(s.url,'_blank');return}location.href=s.url;setTimeout(()=>toast('SSH/Telnet 앱이 설치되어 있어야 연결됩니다.'),700)}
function renderCards(){const host=$('cards');host.innerHTML='';const start=page*PAGE,rows=filtered.slice(start,start+PAGE);const hide=$('hideAccount').checked;rows.forEach(r=>{const c=document.createElement('div');c.className='card';const web=webSpec(r),cli=cliSpec(r);c.innerHTML=`<div class="cardHead"><div class="cardTitle">${esc(r['고객사명']||'(고객사 미입력)')} · ${esc(r['Hostname']||r['시스템 용도']||'장비')}</div><span class="badge">${esc(r['구분']||'미분류')}</span></div><div class="cardSub">${esc(r['Model'])}${r['시스템 용도']?' · '+esc(r['시스템 용도']):''}</div><div class="quick"><span><b>IP</b> ${esc(r['IP정보']||'-')}</span><span><b>S/N</b> ${esc(r['S/N']||'-')}</span><span><b>접속방법</b> ${esc(r['접속방법']||'-')}</span><span><b>계정</b> ${hide?'••••':esc(r['계정']||'-')}</span></div><div class="cardActions"><button class="go" data-a="url" ${web?'':'disabled'}>WEB</button><button class="go" data-a="cli" ${cli?'':'disabled'}>CLI</button><button class="edit" data-a="edit">상세/수정</button><button class="del" data-a="del">삭제</button></div>`;const wb=c.querySelector('[data-a="url"]');if(web)wb.addEventListener('click',()=>openSpec(web));else wb.title='접속 URL이 없습니다.';const cb=c.querySelector('[data-a="cli"]');if(cli)cb.addEventListener('click',()=>openSpec(cli));else cb.title='CLI 접속 또는 IP 정보가 없습니다.';c.querySelector('[data-a="edit"]').onclick=()=>openEdit(r);c.querySelector('[data-a="del"]').onclick=async()=>{if(confirm(`${r['고객사명']} / ${r['Hostname']||r['Model']} 장비를 삭제할까요?`)){await del(r.id);await reload();toast('삭제했습니다.')}};host.appendChild(c)});const pages=Math.max(1,Math.ceil(filtered.length/PAGE));$('pageText').textContent=`${page+1} / ${pages}`;$('prev').disabled=page<=0;$('next').disabled=page>=pages-1}
function statsFor(k){const m=new Map();filtered.forEach(r=>{const v=clean(r[k])||'(미입력)';m.set(v,(m.get(v)||0)+1)});return [...m].sort((a,b)=>b[1]-a[1]).slice(0,300)}
function fillStats(id,k){$(id).innerHTML=statsFor(k).map(([n,v])=>`<div class="statrow"><span>${esc(n)}</span><b>${v.toLocaleString()}</b></div>`).join('')}
function renderStats(){fillStats('sCustomer','고객사명');fillStats('sCategory','구분');fillStats('sModel','Model')}
function openEdit(row=null){editingId=row?.id??null;$('dlgTitle').textContent=row?'장비 상세 수정':'장비 등록';const g=$('formGrid');g.innerHTML='';HEADERS.forEach(h=>{const d=document.createElement('div');d.className='field';const e=document.createElement(MULTI.has(h)?'textarea':'input');e.id='fld_'+HEADERS.indexOf(h);e.value=row?.[h]??(h==='No'&&!row?String(Math.max(0,...allRows.map(x=>parseInt(x['No'])||0))+1):'');d.innerHTML=`<label>${esc(h)}</label>`;d.appendChild(e);g.appendChild(d)});$('editDlg').showModal()}
async function saveEdit(){const o={};HEADERS.forEach((h,i)=>o[h]=clean($('fld_'+i).value));const meaningful=['고객사명','시스템 용도','구분','Hostname','Model','IP정보'].some(h=>o[h]);if(!meaningful)return alert('고객사명, 시스템 용도, 구분, Hostname, Model, IP정보 중 하나 이상 입력하세요.');const n=normalize(o);if(editingId){n.id=editingId;const same=allRows.find(x=>x.dedup===n.dedup&&x.id!==editingId);if(same)return alert('같은 장비 식별값(S/N/MAC/고객사+Hostname/No)이 이미 있습니다.');await put(n)}else{const same=allRows.find(x=>x.dedup===n.dedup);if(same){if(!confirm('같은 장비가 있습니다. 기존 자료를 업데이트할까요?'))return;n.id=same.id;await put(n)}else await add(n)}$('editDlg').close();await reload();toast('저장했습니다.')}
function tab(which){const a=which==='list';$('tabList').classList.toggle('active',a);$('tabStats').classList.toggle('active',!a);$('secList').classList.toggle('active',a);$('secStats').classList.toggle('active',!a)}
function download(blob,name){if(window.Android&&Android.saveBase64){blob.arrayBuffer().then(buf=>{const u=new Uint8Array(buf);let bin='';const step=0x8000;for(let i=0;i<u.length;i+=step)bin+=String.fromCharCode(...u.subarray(i,Math.min(i+step,u.length)));Android.saveBase64(btoa(bin),name,blob.type||'application/octet-stream')}).catch(e=>alert('저장 오류\n'+e.message));return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function u16(n){return [n&255,(n>>>8)&255]} function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function zipStore(entries){const enc=new TextEncoder(),parts=[],central=[];let off=0;for(const [name,text] of entries){const nb=enc.encode(name),data=typeof text==='string'?enc.encode(text):text,crc=crc32(data);const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...nb]);parts.push(lh,data);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...nb]));off+=lh.length+data.length}const csize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(csize),...u32(off),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xmlEsc(s){return clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function colName(n){let s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function makeXlsx(rows){const data=[HEADERS,...rows.map(r=>HEADERS.map(h=>r[h]||''))];let sh='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';data.forEach((row,ri)=>{sh+=`<row r="${ri+1}">`;row.forEach((v,ci)=>{const ref=colName(ci+1)+(ri+1);sh+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`});sh+='</row>'});sh+='</sheetData></worksheet>';return zipStore([
['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="장비 리스트" sheetId="1" r:id="rId1"/></sheets></workbook>'],['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],['xl/worksheets/sheet1.xml',sh]])}
function readU16(d,o){return d[o]|d[o+1]<<8} function readU32(d,o){return (d[o]|d[o+1]<<8|d[o+2]<<16|d[o+3]<<24)>>>0}
async function unzip(buf){const d=new Uint8Array(buf);let eocd=-1;for(let i=d.length-22;i>=Math.max(0,d.length-65557);i--){if(readU32(d,i)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('ZIP 형식이 아닙니다.');const count=readU16(d,eocd+10),cdOff=readU32(d,eocd+16),dec=new TextDecoder(),out={};let p=cdOff;for(let k=0;k<count;k++){if(readU32(d,p)!==0x02014b50)break;const method=readU16(d,p+10),cs=readU32(d,p+20),us=readU32(d,p+24),nl=readU16(d,p+28),el=readU16(d,p+30),cl=readU16(d,p+32),lo=readU32(d,p+42),name=dec.decode(d.slice(p+46,p+46+nl));const lnl=readU16(d,lo+26),lel=readU16(d,lo+28),start=lo+30+lnl+lel,raw=d.slice(start,start+cs);let bytes;if(method===0)bytes=raw;else if(method===8){if(!('DecompressionStream'in window))throw Error('이 브라우저는 압축 XLSX 읽기를 지원하지 않습니다. Chrome 최신 버전을 사용해주세요.');const ds=new DecompressionStream('deflate-raw');bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}else throw Error('지원하지 않는 XLSX 압축 방식입니다.');if(bytes.length!==us&&method===0){}out[name]=bytes;p+=46+nl+el+cl}return out}
function text(bytes){return new TextDecoder().decode(bytes||new Uint8Array())}
function parseSheet(xml,shared=[]){const doc=new DOMParser().parseFromString(xml,'application/xml'),rows=[];doc.querySelectorAll('sheetData > row').forEach(row=>{const a=[];row.querySelectorAll('c').forEach(c=>{const ref=c.getAttribute('r')||'',m=ref.match(/[A-Z]+/),letters=m?m[0]:'A';let col=0;for(const ch of letters)col=col*26+ch.charCodeAt(0)-64;let v='';const t=c.getAttribute('t');if(t==='inlineStr')v=c.querySelector('is t')?.textContent||'';else{v=c.querySelector('v')?.textContent||'';if(t==='s')v=shared[parseInt(v)||0]||''}a[col-1]=v});rows.push(a)});return rows}
async function parseXlsx(file){const z=await unzip(await file.arrayBuffer());let shared=[];if(z['xl/sharedStrings.xml']){const d=new DOMParser().parseFromString(text(z['xl/sharedStrings.xml']),'application/xml');shared=[...d.querySelectorAll('si')].map(si=>[...si.querySelectorAll('t')].map(x=>x.textContent).join(''))}let sheet=z['xl/worksheets/sheet1.xml'];if(!sheet){const name=Object.keys(z).find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n));sheet=z[name]}if(!sheet)throw Error('시트를 찾지 못했습니다.');const rows=parseSheet(text(sheet),shared);let hi=-1,map={};for(let i=0;i<Math.min(10,rows.length);i++){const m={};rows[i].forEach((v,c)=>{const s=clean(v);if(HEADERS.includes(s))m[s]=c});if(('No'in m)&&('구분'in m)&&Object.keys(m).length>=5){hi=i;map=m;break}}if(hi<0)throw Error('장비대장 제목 행을 찾지 못했습니다.');return rows.slice(hi+1).map(a=>{const o={};let has=false;HEADERS.forEach(h=>{o[h]=clean(a[map[h]]);if(o[h])has=true});return has&&o['No'].toLowerCase()!=='ex'?o:null}).filter(Boolean)}
async function importFiles(files){let n=0;for(const f of files){const rows=await parseXlsx(f);for(const o of rows){await upsertByDedup(o);n++;allRows=await getAll()}}await reload();alert(`${n.toLocaleString()}행을 처리했습니다.\n같은 장비는 기존 자료를 업데이트했습니다.`)}
function exportXlsx(){const current=confirm('현재 검색 결과만 내보낼까요?\n\n확인: 현재 검색 결과\n취소: 전체 장비');const rows=current?filtered:allRows;download(makeXlsx(rows),'장비관리대장_'+new Date().toISOString().slice(0,10).replaceAll('-','')+'.xlsx');toast(`${rows.length.toLocaleString()}건 내보내기`)}
function backup(){const payload={app:'UbitecEquipmentLedgerMobile',version:1,exportedAt:new Date().toISOString(),headers:HEADERS,rows:allRows.map(r=>{const o={};HEADERS.forEach(h=>o[h]=r[h]||'');return o})};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'유비텍_장비관리_백업_'+new Date().toISOString().slice(0,10)+'.json')}
async function restoreFile(f){const j=JSON.parse(await f.text());if(!Array.isArray(j.rows))throw Error('유효한 백업 파일이 아닙니다.');if(!confirm(`백업 ${j.rows.length.toLocaleString()}건을 현재 데이터에 합칠까요?`))return;for(const o of j.rows){await upsertByDedup(o);allRows=await getAll()}await reload();toast('백업을 복원했습니다.')}
$('searchBtn').onclick=()=>{page=0;applyFilter()};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){page=0;applyFilter()}});['fCustomer','fCategory','fModel'].forEach(id=>$(id).onchange=()=>{page=0;applyFilter()});$('hideAccount').onchange=renderCards;$('resetBtn').onclick=()=>{$('q').value='';$('fCustomer').value=$('fCategory').value=$('fModel').value='';page=0;applyFilter()};$('prev').onclick=()=>{if(page>0){page--;renderCards();scrollTo(0,0)}};$('next').onclick=()=>{page++;renderCards();scrollTo(0,0)};$('tabList').onclick=()=>tab('list');$('tabStats').onclick=()=>tab('stats');$('addBtn').onclick=()=>openEdit();$('cancelEdit').onclick=()=>$('editDlg').close();$('saveEdit').onclick=saveEdit;
$('btnImport').onclick=()=>$('fileImport').click();$('fileImport').onchange=async e=>{try{await importFiles([...e.target.files])}catch(err){alert('엑셀 가져오기 오류\n'+err.message)}finally{e.target.value=''}};$('btnExport').onclick=exportXlsx;$('btnBackup').onclick=backup;$('btnRestore').onclick=()=>$('fileRestore').click();$('fileRestore').onchange=async e=>{try{if(e.target.files[0])await restoreFile(e.target.files[0])}catch(err){alert('복원 오류\n'+err.message)}finally{e.target.value=''}};$('btnClear').onclick=async()=>{if(confirm('모바일 장비 데이터를 모두 삭제할까요?\n백업 후 진행을 권장합니다.')){await clearDB();await reload();toast('전체 데이터를 삭제했습니다.')}};
(async()=>{try{await openDB();await reload()}catch(e){alert('데이터베이스를 시작하지 못했습니다.\n'+e.message)}})();
